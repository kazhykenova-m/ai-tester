name: Site audit
on:
  workflow_dispatch:
    inputs:
      url:
        description: Публичный URL
        required: true
      scenario:
        description: Настроенный JSON в репозитории
        default: scenarios/projects/landing.json
      mobile:
        description: Мобильный экран
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Run deterministic audit
        env:
          SITE_URL: ${{ inputs.url }}
          SCENARIO_FILE: ${{ inputs.scenario }}
          MOBILE: ${{ inputs.mobile }}
        run: |
          extra_args=()
          if [ "$MOBILE" = "true" ]; then extra_args+=(--mobile); fi
          PYTHONPATH=src python scripts/run_agent.py "$SCENARIO_FILE" --url "$SITE_URL" --headless "${extra_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: developer-report
          path: artifacts/
